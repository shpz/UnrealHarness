project:
  source: sample/TPSample
  uproject: TPSample.uproject
  engineAssociation: "5.7"
  target: TPSampleEditor
  platform: Win64
  configuration: Development

skills:
  ue-build:
    path: skills/ue-build
  ue-autotest:
    path: skills/ue-autotest
    # ue-autotest hard-depends on ue-build in production:
    # autotest.py invokes ../ue-build/build.py for compilation.
    requires:
      - ue-build

conditions:
  - id: no-skills
    skills: []
  - id: ue-build-only
    skills:
      - ue-build
  - id: ue-autotest-with-build
    skills:
      - ue-build
      - ue-autotest

runner:
  runRoot: .bench/runs
  trials: 5
  copyExcludes:
    - Binaries
    - DerivedDataCache
    - Intermediate
    - Saved
  artifacts:
    - agent.prompt.md
    - prompt-input.json
    - git.diff
    - agent.stdout.log
    - agent.stderr.log
    - build.log
    - automation
    - verifier_result.json
