---
# Test module auto-discovery pattern
testModulePattern: "Source/*Test/*.Build.cs"

# Map module names to test categories for scope keywords (unit/integration/performance).
# Disabled by default: uncomment and fill in with YOUR project's actual test
# module names before using category scopes.
# moduleCategories:
#   MyProjectCoreTest: "unit"
#   MyProjectIntegrationTest: "integration"
#   MyProjectPerfTest: "performance"

# Editor process timeout (seconds)
editorTimeoutSeconds: 600

# Editor command-line arguments (always applied)
editorExtraArgs:
  - "-unattended"
  - "-nopause"
  - "-nosplash"
  - "-log"

# Log parsing regex patterns, used only as fallback when the native
# Automation report (index.json) is missing (customizable per UE version)
logPatterns:
  testPassed: 'LogAutomationController:\s+(.+?)\s+passed\s*\(([^)]+)\)'
  testFailed: 'LogAutomationController:\s+(.+?)\s+failed'
  testError: 'LogAutomationController:\s*Error:\s*(.+)'
